<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dispute Intake Review</title>
<style>
  :root {
    --text: #1f2937; --muted: #6b7280; --line: #d1d5db; --tint: #f3f4f6;
    --accent: #1d4ed8;
    --warn-bg: #fef3c7; --warn-edge: #d97706; --warn-text: #78350f;
  }
  body { font: 16px/1.5 system-ui, sans-serif; color: var(--text); background: #fff;
         margin: 0; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; gap: 16px; }
  h1 { font-size: 1.25rem; margin: 0; }
  .sub { color: var(--muted); font-size: 0.875rem; }
  .top label { margin-left: auto; }
  #cases { display: flex; flex-wrap: nowrap; gap: 4px; overflow-x: auto; margin-top: 8px; }
  #cases button { white-space: nowrap; font-size: 0.8125rem; padding: 2px 8px; color: var(--text);
                  background: #fff; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; }
  #cases button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
  main > section { overflow-y: auto; padding: 16px; }
  #left { border-right: 1px solid var(--line); }
  h2 { font-size: 1rem; margin: 0 0 12px; color: var(--muted); }
  h3 { font-size: 0.875rem; margin: 20px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  #right > h3:first-child { margin-top: 0; }
  .turn { margin: 0 0 8px; padding: 6px 10px; border-radius: 4px; }
  .turn.customer { background: var(--tint); }
  #decision { font-size: 1.5rem; font-weight: 600; margin: 0; }
  #escalate_reason { color: var(--muted); margin: 0; }
  #rationale { margin: 4px 0 0; max-width: 75ch; }
  .actions { margin: 12px 0; }
  #approve, #override-open { font-size: 1rem; padding: 8px 20px; margin-right: 8px; cursor: pointer; }
  #status { color: var(--text); }
  fieldset { border: 1px solid var(--line); border-radius: 4px; }
  #banner { background: var(--warn-bg); border-left: 4px solid var(--warn-edge); color: var(--warn-text);
            padding: 8px 12px; font-weight: 600; margin: 0 0 12px; }
  #note { max-width: 75ch; margin: 0; }
  #policy { margin: 8px 0 0; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid var(--line); padding: 2px 8px; text-align: left; vertical-align: top; }
  th { font-weight: 500; color: var(--muted); }
  .fired { background: var(--tint); padding: 4px 12px; border-radius: 4px; }
  details { margin-top: 20px; }
  #error { color: #b00; }
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1>Dispute intake review</h1>
      <div class="sub">Model proposals. Nothing is executed.</div>
    </div>
    <span id="error"></span>
    <label>Run <select id="run"></select></label>
  </div>
  <div id="cases"></div>
</header>
<main>
  <section id="left">
    <h2 id="title"></h2>
    <div id="transcript"></div>
  </section>
  <section id="right">
    <h3>Model proposal</h3>
    <p id="decision"></p>
    <p id="escalate_reason"></p>
    <p id="rationale"></p>
    <div class="actions">
      <button id="approve">Approve</button>
      <button id="override-open">Override</button>
      <span id="status"></span>
    </div>
    <form id="override-form" hidden>
      <fieldset>
        <legend>Override</legend>
        <label>intent <select name="intent"></select></label><br>
        <label>escalate_reason <select name="escalate_reason"></select></label><br>
        <label>next_action <select name="next_action"></select></label><br>
        <label>temp_credit_eligible <select name="temp_credit_eligible"></select></label><br>
        <label>Reason (required)<br><textarea name="reason" rows="3" cols="50"></textarea></label><br>
        <button type="submit" id="save" disabled>Save override</button>
        <button type="button" id="override-cancel">Cancel</button>
      </fieldset>
    </form>
    <p id="banner" hidden>Note reflects the model's proposal, not the override. Regenerate before saving to the case.</p>
    <h3>Note</h3>
    <p id="note"></p>
    <p id="policy"><b>Policy basis in record:</b> <span id="policy_ids"></span></p>
    <h3>Payload</h3>
    <table id="payload"></table>
    <h3>Checks</h3>
    <div id="checks"></div>
    <details id="retrieved-box">
      <summary id="retrieved-summary"></summary>
      <div id="retrieved"></div>
    </details>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
// Shown in the decision summary and policy line above, so left out of the payload table.
const SHOWN = new Set(["intent", "escalate_reason", "next_action", "policy_ids"]);
const OVERRIDE_FIELDS = ["intent", "escalate_reason", "next_action", "temp_credit_eligible"];
const SPEAKER = /^(Agent|Customer):\s*/;
const form = $("override-form");
let current = null;
let currentCase = null;

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: ${r.status}`);
  return r.json();
}

function fmt(v) {
  return v === null ? "null" : typeof v === "object" ? JSON.stringify(v) : String(v);
}

function el(tag, text) {
  const e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  return e;
}

// One block per "Agent:" / "Customer:" line; unprefixed lines join the previous turn.
function turns(transcript) {
  const out = [];
  for (const line of transcript.split("\n")) {
    if (!line.trim()) continue;
    const m = line.match(SPEAKER);
    if (m || !out.length) {
      const d = el("div");
      d.className = "turn" + (m && m[1] === "Customer" ? " customer" : "");
      if (m) d.append(el("b", m[1] + ":"), " ");
      d.append(m ? line.slice(m[0].length) : line);
      out.push(d);
    } else {
      out[out.length - 1].append(" " + line.trim());
    }
  }
  return out;
}

async function init() {
  // Option values are JSON so true/false/null/"n/a" round-trip with their native types.
  const enums = await getJSON("/api/enums");
  for (const f of OVERRIDE_FIELDS) {
    for (const v of enums[f]) form.elements[f].add(new Option(fmt(v), JSON.stringify(v)));
  }
  const runs = await getJSON("/api/runs");
  for (const r of runs) $("run").add(new Option(r, r));
  const want = params.get("run");
  $("run").value = runs.includes(want) ? want : runs.includes("holdout") ? "holdout" : runs[0];
  $("run").onchange = () => loadRun(null).catch(showError);
  await loadRun(params.get("case"));
}

async function loadRun(caseId) {
  const cases = await getJSON(`/api/run/${$("run").value}`);
  $("cases").replaceChildren(...cases.map(c => {
    const b = el("button", `${c.id} ${c.intent}` + (c.checks ? " •" : ""));
    if (c.checks) b.title = `${c.checks} check${c.checks > 1 ? "s" : ""} fired`;
    b.dataset.id = c.id;
    b.onclick = () => openCase(c.id).catch(showError);
    return b;
  }));
  const ids = cases.map(c => c.id);
  if (ids.length) await openCase(ids.includes(caseId) ? caseId : ids[0]);
}

async function openCase(id) {
  const run = $("run").value;
  current = id;
  const c = await getJSON(`/api/case/${run}/${id}`);
  if (current !== id) return;  // a later click won the race
  history.replaceState(null, "", `?run=${run}&case=${id}`);
  for (const b of $("cases").children) b.classList.toggle("active", b.dataset.id === id);
  currentCase = c;
  form.hidden = true;
  form.elements.reason.value = "";
  $("save").disabled = true;
  $("banner").hidden = true;
  $("status").textContent = "";

  $("title").textContent = `${c.id} (${c.run}), call date ${c.call_date}`;
  $("transcript").replaceChildren(...turns(c.transcript));
  $("decision").textContent = `${c.intent} → ${c.payload.next_action}`;
  $("escalate_reason").hidden = c.escalate_reason === null;
  $("escalate_reason").textContent = `escalate_reason: ${fmt(c.escalate_reason)}`;
  $("rationale").textContent = c.classifier_rationale;
  $("payload").replaceChildren(...Object.entries(c.payload).filter(([k]) => !SHOWN.has(k)).map(([k, v]) => {
    const tr = el("tr");
    tr.append(el("th", k), el("td", v === null ? "—" : fmt(v)));
    return tr;
  }));
  $("policy_ids").textContent = c.payload.policy_ids.join(", ") || "none";
  $("note").textContent = c.note;

  $("checks").className = c.checks.length ? "fired" : "";
  $("checks").replaceChildren(c.checks.length ? el("ul") : el("p", "None fired."));
  for (const ch of c.checks) $("checks").firstChild.append(el("li", ch));

  $("retrieved-box").open = false;
  $("retrieved-summary").textContent = `Retrieved snippets (${c.retrieved.length})`;
  $("retrieved").replaceChildren(...c.retrieved.map(r => {
    const p = el("p");
    p.append(el("b", r.id), ` (score ${r.score}): ${r.text}`);
    return p;
  }));
}

function original(c) {
  return {intent: c.intent, escalate_reason: c.escalate_reason,
          next_action: c.payload.next_action, temp_credit_eligible: c.payload.temp_credit_eligible};
}

async function postLog(body) {
  const c = currentCase;
  const r = await fetch("/api/log", {method: "POST", headers: {"Content-Type": "application/json"},
                                     body: JSON.stringify({run: c.run, case: c.id, ...body})});
  const data = await r.json();
  if (!r.ok) throw new Error(data.error);
  return currentCase === c ? data : null;  // null if the user moved to another case meanwhile
}

$("approve").onclick = async () => {
  try {
    const entry = await postLog({action: "approve"});
    if (entry) $("status").textContent = `Approved, logged ${entry.timestamp}`;
  } catch (e) { showError(e); }
};

$("override-open").onclick = () => {
  const o = original(currentCase);
  for (const f of OVERRIDE_FIELDS) form.elements[f].value = JSON.stringify(o[f]);
  form.hidden = false;
};

$("override-cancel").onclick = () => { form.hidden = true; };

form.elements.reason.oninput = () => { $("save").disabled = !form.elements.reason.value.trim(); };

form.onsubmit = async e => {
  e.preventDefault();
  const override = Object.fromEntries(OVERRIDE_FIELDS.map(f => [f, JSON.parse(form.elements[f].value)]));
  try {
    const entry = await postLog({action: "override", override, reason: form.elements.reason.value});
    if (!entry) return;
    form.hidden = true;
    $("banner").hidden = false;
    $("status").textContent = `Override logged: ${override.intent} → ${override.next_action}`;
  } catch (err) { showError(err); }
};

function showError(e) { $("error").textContent = String(e); }

init().catch(showError);
</script>
</body>
</html>
